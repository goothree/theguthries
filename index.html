<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FamJam</title>
  <!-- Installable web app (Add to Home Screen). Relative paths so it works
       both at the site root and under a GitHub Pages subpath. -->
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FamJam" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:   #2563eb;
      --brand2:  #3b82f6;
      --bg:      #f0f4f9;
      --card:    #ffffff;
      --text:    #1e2a3a;
      --muted:   #64748b;
      --border:  #cdd8e8;
      --red:     #c0392b;
      --radius:  14px;
      --shadow:  0 2px 12px rgba(0,0,0,.08);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #dbeafe 0%, #f0f4f9 60%); }
    .auth-box { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px 36px; width: 100%; max-width: 420px; }
    .auth-box h1 { font-size: 1.8rem; color: var(--brand); margin-bottom: 4px; }
    .auth-box .subtitle { color: var(--muted); font-size: .95rem; margin-bottom: 28px; }
    .tab-row { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 10px; font-size: .95rem; font-weight: 600; background: none; border: none; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }
    label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    input[type=text], input[type=email], input[type=password], textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .95rem; font-family: inherit; background: #fafaf8; transition: border-color .2s; }
    input:focus, textarea:focus { outline: none; border-color: var(--brand2); }
    .field { margin-bottom: 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; border: none; transition: all .2s; }
    .btn-primary { background: var(--brand); color: #fff; width: 100%; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
    .btn-secondary:hover { background: #eff6ff; }
    .btn-sm { padding: 7px 14px; font-size: .85rem; border-radius: 6px; }
    .msg { padding: 10px 14px; border-radius: 8px; font-size: .9rem; margin-bottom: 14px; display: none; }
    .msg.error { background: #fde8e6; color: var(--red); display: block; }
    .msg.info  { background: #e6f4e2; color: #2d6a22; display: block; }
    #app-screen { display: none; }
    header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
    .header-inner { max-width: 700px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .site-name { font-size: 1.3rem; font-weight: 700; color: var(--brand); }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .95rem; }
    .user-name { font-size: .9rem; font-weight: 600; }
    main { max-width: 700px; margin: 0 auto; padding: 28px 20px 60px; }
    .composer { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 28px; }
    .composer h2 { font-size: 1rem; font-weight: 700; margin-bottom: 14px; color: var(--brand); }
    textarea.post-body { min-height: 90px; resize: vertical; }
    .composer-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; gap: 10px; }
    .file-label { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; color: var(--brand); cursor: pointer; padding: 8px 14px; border: 1.5px solid var(--brand); border-radius: 6px; transition: background .2s; }
    .file-label:hover { background: #eff6ff; }
    #photo-input { display: none; }
    .selected-file { font-size: .8rem; color: var(--muted); margin-top: 4px; }
    #photo-preview { display: none; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #photo-preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
    .post-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
    .post-card img { width: 100%; max-height: 400px; object-fit: cover; display: block; }
    .post-body-content { padding: 18px 20px 0; }
    .post-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand2); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem; flex-shrink: 0; }
    .post-author { font-weight: 700; font-size: .9rem; }
    .post-date { font-size: .8rem; color: var(--muted); }
    .post-text { line-height: 1.65; font-size: .97rem; white-space: pre-wrap; margin-bottom: 4px; }
    .post-delete { margin-top: 8px; font-size: .8rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; }
    .post-delete:hover { color: var(--red); }
    .reactions-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 20px; border-top: 1px solid var(--border); margin-top: 12px; }
    .reaction-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 20px; border: 1.5px solid var(--border); background: none; cursor: pointer; font-size: .95rem; transition: all .15s; color: var(--text); }
    .reaction-btn:hover { border-color: var(--brand2); background: #eff6ff; }
    .reaction-btn.reacted { border-color: var(--brand); background: #dbeafe; }
    .reaction-count { font-size: .78rem; font-weight: 600; color: var(--muted); }
    .reaction-btn.reacted .reaction-count { color: var(--brand); }
    .comments-section { padding: 0 20px 16px; }
    .comments-list { margin-bottom: 10px; }
    .comment-item { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .comment-item:last-child { border-bottom: none; }
    .comment-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--brand2); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .7rem; flex-shrink: 0; margin-top: 1px; }
    .comment-body { flex: 1; }
    .comment-author { font-weight: 700; font-size: .82rem; }
    .comment-text { font-size: .88rem; line-height: 1.5; }
    .comment-date { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .comment-delete { font-size: .75rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }
    .comment-delete:hover { color: var(--red); }
    .comment-input-row { display: flex; gap: 8px; margin-top: 6px; }
    .comment-input-row input { flex: 1; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 20px; font-size: .88rem; font-family: inherit; background: #f8fafc; transition: border-color .2s; }
    .comment-input-row input:focus { outline: none; border-color: var(--brand2); }
    .comment-submit { padding: 8px 14px; background: var(--brand); color: #fff; border: none; border-radius: 20px; font-size: .85rem; font-weight: 600; cursor: pointer; transition: background .2s; white-space: nowrap; }
    .comment-submit:hover { background: #1d4ed8; }
    .empty-feed { text-align: center; padding: 60px 20px; color: var(--muted); font-size: .95rem; }
    .spinner { border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; width: 28px; height: 28px; animation: spin .7s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--brand); color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .2s; }
    .icon-btn:hover { background: #1d4ed8; }
    .user-menu { position: relative; }
    .user-menu-trigger { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 8px; color: var(--text); font-family: inherit; }
    .user-menu-trigger:hover { background: rgba(0,0,0,.05); }
    .caret { font-size: .7rem; color: var(--muted); }
    .user-dropdown { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); min-width: 190px; padding: 6px; display: none; z-index: 200; }
    .user-dropdown.open { display: block; }
    .user-dropdown button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 10px 12px; font-size: .9rem; font-weight: 600; color: var(--text); cursor: pointer; border-radius: 6px; font-family: inherit; }
    .user-dropdown button:hover { background: rgba(37,99,235,.10); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 300; align-items: flex-start; justify-content: center; padding: 60px 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal-composer { width: 100%; max-width: 640px; margin: 0; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-head h2 { margin-bottom: 0; }
    .modal-close { background: none; border: none; font-size: 1.1rem; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1; }
    .modal-close:hover { color: var(--text); background: rgba(0,0,0,.06); }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--card); padding: 12px 20px; border-radius: 10px; font-size: .9rem; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 400; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .reactions-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
    .reactions-row:empty { display: none; }
    .add-reaction-btn { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border); background: none; color: var(--muted); font-size: 1.3rem; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; }
    .add-reaction-btn:hover { border-color: var(--brand2); color: var(--brand); background: #eff6ff; }
    .emoji-popover { position: fixed; display: none; z-index: 350; box-shadow: 0 8px 30px rgba(0,0,0,.28); border-radius: 12px; }
    .emoji-popover.open { display: block; }
    .post-single-img { width: 100%; max-height: 400px; object-fit: cover; display: block; cursor: pointer; }
    .post-collage { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
    .collage-tile { position: relative; overflow: hidden; cursor: pointer; aspect-ratio: 1 / 1; }
    .collage-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .post-collage.n3 .collage-tile:first-child { grid-column: 1 / -1; aspect-ratio: 2 / 1; }
    .collage-more { position: absolute; inset: 0; background: rgba(0,0,0,.5); color: #fff; font-size: 1.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.93); z-index: 500; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lb-img { max-width: 92vw; max-height: 86vh; object-fit: contain; border-radius: 6px; user-select: none; }
    .lb-close { position: absolute; top: 16px; right: 18px; background: rgba(0,0,0,.45); color: #fff; border: none; font-size: 1.3rem; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; }
    .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.45); color: #fff; border: none; font-size: 2rem; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lb-prev { left: 14px; } .lb-next { right: 14px; }
    .lb-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: .9rem; background: rgba(0,0,0,.45); padding: 5px 12px; border-radius: 20px; }
    .lb-nav[hidden], .lb-counter[hidden] { display: none; }
    @media (max-width: 500px) { .auth-box { padding: 28px 20px; } .composer-actions { flex-direction: column; align-items: flex-start; } .btn-primary.post-btn { width: 100%; } }
    /* Follow the OS light/dark appearance setting. */
    @media (prefers-color-scheme: dark) {
      :root {
        --brand:   #3b82f6;
        --brand2:  #60a5fa;
        --bg:      #0f172a;
        --card:    #1e293b;
        --text:    #e6edf6;
        --muted:   #94a3b8;
        --border:  #334155;
        --red:     #f87171;
        --shadow:  0 2px 12px rgba(0,0,0,.5);
      }
      #auth-screen { background: linear-gradient(135deg, #0b1220 0%, #0f172a 60%); }
      input[type=text], input[type=email], input[type=password], textarea,
      .comment-input-row input { background: #0f172a; color: var(--text); }
      input::placeholder, textarea::placeholder { color: var(--muted); }
      .btn-primary:hover, .comment-submit:hover, .icon-btn:hover { background: #2563eb; }
      .btn-secondary:hover, .file-label:hover, .reaction-btn:hover, .add-reaction-btn:hover { background: rgba(96,165,250,.15); }
      .user-menu-trigger:hover, .modal-close:hover { background: rgba(255,255,255,.07); }
      .reaction-btn.reacted { background: rgba(96,165,250,.28); }
      .msg.error { background: rgba(248,113,113,.18); color: #fca5a5; }
      .msg.info  { background: rgba(74,222,128,.16); color: #86efac; }
      header { box-shadow: 0 1px 6px rgba(0,0,0,.4); }
    }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h1>FamJam</h1>
    <p class="subtitle">A private space for family photos &amp; stories.</p>
    <div class="tab-row">
      <button class="tab-btn active" onclick="showTab('login')">Sign In</button>
      <button class="tab-btn" onclick="showTab('signup')">Create Account</button>
    </div>
    <div id="auth-msg" class="msg"></div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com" required /></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required /></div>
      <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
    </form>
    <form id="signup-form" style="display:none" onsubmit="handleSignup(event)">
      <div class="field"><label>Your Name</label><input type="text" id="signup-name" placeholder="Jane Smith" required /></div>
      <div class="field"><label>Email</label><input type="email" id="signup-email" placeholder="you@example.com" required /></div>
      <div class="field"><label>Password</label><input type="password" id="signup-password" placeholder="At least 8 characters" minlength="8" required /></div>
      <p class="subtitle" style="margin-bottom:16px">This site is invite-only. Use the email a family admin added for you.</p>
      <button type="submit" class="btn btn-primary" id="signup-btn">Create Account</button>
    </form>
  </div>
</div>

<div id="app-screen">
  <header>
    <div class="header-inner">
      <span class="site-name">FamJam</span>
      <div class="user-info">
        <button class="icon-btn" id="new-post-btn" onclick="openComposer()" title="New post" aria-label="New post">+</button>
        <div class="user-menu">
          <button class="user-menu-trigger" onclick="toggleUserMenu(event)" aria-haspopup="true">
            <div class="avatar" id="header-avatar">?</div>
            <span class="user-name" id="header-name">Loading&hellip;</span>
            <span class="caret">&#9662;</span>
          </button>
          <div class="user-dropdown" id="user-dropdown">
            <button id="enable-notif-btn" onclick="enableNotifications()" style="display:none">&#128276; Enable notifications</button>
            <button onclick="handleSignOut()">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div id="feed"><div class="spinner"></div></div>
  </main>

  <!-- Compose modal, opened via the + button in the header. -->
  <div id="composer-modal" class="modal-overlay" onclick="if(event.target===this)closeComposer()">
    <div class="composer modal-composer">
      <div class="modal-head">
        <h2>Share Something</h2>
        <button class="modal-close" onclick="closeComposer()" aria-label="Close">&#10005;</button>
      </div>
      <div id="post-msg" class="msg"></div>
      <div class="field">
        <textarea class="post-body" id="post-text" placeholder="What's happening in the family? Share a story, update, or memory&hellip;"></textarea>
      </div>
      <div id="photo-preview"></div>
      <div class="composer-actions">
        <div>
          <label class="file-label" for="photo-input">&#128247; Add Photos</label>
          <input type="file" id="photo-input" accept="image/*" multiple onchange="previewPhotos(event)" />
          <div class="selected-file" id="file-name"></div>
        </div>
        <button class="btn btn-primary post-btn" onclick="submitPost()">Post to Family</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="emoji-popover" class="emoji-popover"><emoji-picker></emoji-picker></div>
  <div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLightbox()">
    <button class="lb-close" onclick="closeLightbox()" aria-label="Close">&#10005;</button>
    <button class="lb-nav lb-prev" onclick="lightboxPrev(event)" aria-label="Previous">&#8249;</button>
    <img id="lightbox-img" class="lb-img" src="" alt="photo" />
    <button class="lb-nav lb-next" onclick="lightboxNext(event)" aria-label="Next">&#8250;</button>
    <div class="lb-counter" id="lightbox-counter"></div>
  </div>
</div>

<script>
const SUPABASE_URL  = 'https://otdpvabxlaygvxpqgwuk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90ZHB2YWJ4bGF5Z3Z4cHFnd3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MTEwODgsImV4cCI6MjA4ODM4NzA4OH0.DpSiLf0cJ4CqUvS2efm4C7qw1YaVi-9ZY5DIWiJrEws';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
// Deletion permissions:
//  - Family members (any @theguthries.org address) can delete their own posts.
//  - The admin (michael@theguthries.org) can delete any post.
// NOTE: the database (Supabase RLS) is the real enforcement layer — see
// supabase-setup.sql. These constants only control which buttons are shown.
const FAMILY_DOMAIN = 'theguthries.org';
const ADMIN_EMAIL   = 'michael@theguthries.org';

// Web Push (browser / installed PWA notifications). This is the PUBLIC VAPID key.
const VAPID_PUBLIC_KEY = 'BJjY75xQgjgSbopWcr9PUgFZLSGDdit-YZzufZ2q7RG1NXAbO2OGYcZgv7XD_oR_HrAgZ-ExhJZvrg50jJwaiAo';
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

let currentUser = null, currentProfile = null;

async function init() {
  setupEmojiPicker();
  const { data: { session } } = await sb.auth.getSession();
  if (session) { currentUser = session.user; await loadProfile(); showApp(); } else showAuth();
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) { currentUser = session.user; await loadProfile(); showApp(); }
    else if (event === 'SIGNED_OUT') { currentUser = null; currentProfile = null; showAuth(); }
  });
}
async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = data;
}
function showAuth() { document.getElementById('auth-screen').style.display='flex'; document.getElementById('app-screen').style.display='none'; }
function showApp() {
  document.getElementById('auth-screen').style.display='none'; document.getElementById('app-screen').style.display='block';
  const name = currentProfile?.name || currentUser.email;
  document.getElementById('header-name').textContent = name;
  document.getElementById('header-avatar').textContent = name.charAt(0).toUpperCase();
  loadFeed();
  setupNotifUI();
}
function pushSupported() {
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
async function setupNotifUI() {
  const btn = document.getElementById('enable-notif-btn');
  if (!btn) return;
  if (!pushSupported() || Notification.permission === 'denied') { btn.style.display = 'none'; return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if (existing && Notification.permission === 'granted') {
      await storeSubscription(existing);
      btn.style.display = 'none';
    } else {
      btn.style.display = 'block';
    }
  } catch (e) { btn.style.display = 'block'; }
}
function openComposer() {
  closeUserMenu();
  document.getElementById('composer-modal').classList.add('open');
  setTimeout(() => { const t = document.getElementById('post-text'); if (t) t.focus(); }, 50);
}
function closeComposer() { document.getElementById('composer-modal').classList.remove('open'); }
function toggleUserMenu(e) { if (e) e.stopPropagation(); document.getElementById('user-dropdown').classList.toggle('open'); }
function closeUserMenu() { const d = document.getElementById('user-dropdown'); if (d) d.classList.remove('open'); }
document.addEventListener('click', (e) => {
  const menu = document.querySelector('.user-menu');
  if (menu && !menu.contains(e.target)) closeUserMenu();
});
function toast(text) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = text; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3200);
}
async function enableNotifications() {
  closeUserMenu();
  if (!pushSupported()) { toast('Notifications aren\u2019t supported here. On iPhone, add the site to your Home Screen first.'); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications weren\u2019t enabled (permission not granted).'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    }
    await storeSubscription(sub);
    document.getElementById('enable-notif-btn').style.display = 'none';
    toast('Notifications enabled on this device!');
  } catch (e) {
    toast('Could not enable notifications: ' + (e.message || e));
  }
}
async function storeSubscription(sub) {
  const j = sub.toJSON();
  if (!currentUser || !j.keys) return;
  await sb.from('push_subscriptions').upsert(
    { user_id: currentUser.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth },
    { onConflict: 'endpoint' }
  );
}
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function showTab(tab) {
  document.getElementById('login-form').style.display  = tab==='login'  ? 'block':'none';
  document.getElementById('signup-form').style.display = tab==='signup' ? 'block':'none';
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active',(tab==='login'&&i===0)||(tab==='signup'&&i===1)));
  hideMsg('auth-msg');
}
async function handleLogin(e) {
  e.preventDefault(); const btn=document.getElementById('login-btn'); btn.textContent='Signing in…'; btn.disabled=true;
  const { error } = await sb.auth.signInWithPassword({ email:document.getElementById('login-email').value, password:document.getElementById('login-password').value });
  btn.textContent='Sign In'; btn.disabled=false;
  if (error) showMsg('auth-msg', error.message, 'error');
}
async function handleSignup(e) {
  e.preventDefault(); const btn=document.getElementById('signup-btn'); const name=document.getElementById('signup-name').value.trim();
  btn.textContent='Creating account…'; btn.disabled=true;
  const { data, error } = await sb.auth.signUp({ email:document.getElementById('signup-email').value, password:document.getElementById('signup-password').value, options:{data:{name}} });
  if (error) {
    const m = (error.message||'');
    // Blocked (invite-only) sign-ups surface as a generic 500 from the auth
    // API — the DB trigger message doesn't reach the client — so treat 500 as
    // "not invited". Other errors (e.g. already-registered) keep their message.
    const invite = error.status === 500 || /invite_only|has not been invited|Database error saving new user/i.test(m);
    showMsg('auth-msg', invite ? 'This email hasn\u2019t been invited yet. Ask a family admin to add you, then try again.' : m, 'error');
  }
  else { if (data.user) await sb.from('profiles').upsert({id:data.user.id,name}); showMsg('auth-msg','Account created! Sign in below.','info'); }
  btn.textContent='Create Account'; btn.disabled=false;
}
async function handleSignOut() { await sb.auth.signOut(); }
function previewPhotos(e) {
  const files=Array.from(e.target.files||[]);
  const prev=document.getElementById('photo-preview');
  prev.innerHTML='';
  if(!files.length){ prev.style.display='none'; document.getElementById('file-name').textContent=''; return; }
  document.getElementById('file-name').textContent=files.length+(files.length===1?' photo selected':' photos selected');
  prev.style.display='flex';
  files.forEach(file=>{ const reader=new FileReader(); reader.onload=ev=>{const img=document.createElement('img');img.src=ev.target.result;prev.appendChild(img);}; reader.readAsDataURL(file); });
}
async function submitPost() {
  const text=document.getElementById('post-text').value.trim(); const files=Array.from(document.getElementById('photo-input').files||[]);
  if (!text&&!files.length) { showMsg('post-msg','Please write something or add a photo!','error'); return; } hideMsg('post-msg');
  const postBtn=document.querySelector('#composer-modal .post-btn'); if(postBtn){postBtn.disabled=true; postBtn.textContent=files.length>1?'Uploading…':'Posting…';}
  let photo_urls=[];
  for (const file of files) {
    const ext=file.name.split('.').pop(); const path=`${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error:upErr } = await sb.storage.from('family-photos').upload(path,file);
    if (upErr) { showMsg('post-msg','Photo upload failed: '+upErr.message,'error'); if(postBtn){postBtn.disabled=false;postBtn.textContent='Post to Family';} return; }
    const { data:urlData } = sb.storage.from('family-photos').getPublicUrl(path); photo_urls.push(urlData.publicUrl);
  }
  const { error } = await sb.from('posts').insert({ user_id:currentUser.id, author:currentProfile?.name||currentUser.email, body:text, photo_url:photo_urls[0]||null, photo_urls:photo_urls.length?photo_urls:null });
  if (postBtn){postBtn.disabled=false;postBtn.textContent='Post to Family';}
  if (error) { showMsg('post-msg',error.message,'error'); return; }
  document.getElementById('post-text').value=''; document.getElementById('photo-input').value='';
  document.getElementById('photo-preview').innerHTML=''; document.getElementById('photo-preview').style.display='none';
  document.getElementById('file-name').textContent=''; document.getElementById('photo-preview').style.display='none';
  hideMsg('post-msg');
  closeComposer();
  toast('Posted to the family!');
  loadFeed();
}
async function loadFeed() {
  const feed=document.getElementById('feed'); feed.innerHTML='<div class="spinner"></div>';
  const { data:posts, error } = await sb.from('posts').select('*').order('created_at',{ascending:false});
  if (error) { feed.innerHTML=`<p style="color:red">${error.message}</p>`; return; }
  if (!posts||posts.length===0) { feed.innerHTML='<div class="empty-feed"><p>No posts yet — be the first to share something!</p></div>'; return; }
  const ids=posts.map(p=>p.id);
  const [{ data:reactions },{ data:comments }] = await Promise.all([
    sb.from('reactions').select('*').in('post_id',ids),
    sb.from('comments').select('*').in('post_id',ids).order('created_at',{ascending:true}),
  ]);
  const rxByPost={}, cmtByPost={};
  ids.forEach(id=>{ rxByPost[id]=[]; cmtByPost[id]=[]; });
  (reactions||[]).forEach(r=>rxByPost[r.post_id]?.push(r));
  (comments||[]).forEach(c=>cmtByPost[c.post_id]?.push(c));
  feed.innerHTML=posts.map(p=>renderPost(p,rxByPost[p.id]||[],cmtByPost[p.id]||[])).join('');
}
function currentEmail() { return (currentUser?.email || '').toLowerCase(); }
function isAdminUser() { return currentEmail() === ADMIN_EMAIL.toLowerCase(); }
function isFamilyMember() { return currentEmail().endsWith('@' + FAMILY_DOMAIN.toLowerCase()); }
function canDeletePost(p) {
  const isOwn = p.user_id === currentUser?.id;
  return isAdminUser() || (isOwn && isFamilyMember());
}
let feedImages = {};
function renderCollage(postId, imgs) {
  if (!imgs.length) return '';
  if (imgs.length === 1) {
    return `<img class="post-single-img" src="${escHtml(imgs[0])}" alt="photo" loading="lazy" onclick="openLightbox('${postId}',0)" />`;
  }
  const shown = imgs.slice(0, 4);
  const extra = imgs.length - 4;
  const tiles = shown.map((url, i) => {
    const overlay = (i === 3 && extra > 0) ? `<span class="collage-more">+${extra}</span>` : '';
    return `<div class="collage-tile" onclick="openLightbox('${postId}',${i})"><img src="${escHtml(url)}" alt="photo" loading="lazy" />${overlay}</div>`;
  }).join('');
  return `<div class="post-collage n${Math.min(imgs.length, 4)}">${tiles}</div>`;
}
let lbImages = [], lbIndex = 0;
function openLightbox(postId, index) {
  const imgs = feedImages[postId] || [];
  if (!imgs.length) return;
  lbImages = imgs; lbIndex = index || 0;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
}
function renderLightbox() {
  document.getElementById('lightbox-img').src = lbImages[lbIndex];
  const multi = lbImages.length > 1;
  const counter = document.getElementById('lightbox-counter');
  counter.textContent = multi ? `${lbIndex + 1} / ${lbImages.length}` : '';
  counter.hidden = !multi;
  document.querySelector('.lb-prev').hidden = !multi;
  document.querySelector('.lb-next').hidden = !multi;
}
function lightboxPrev(e) { if (e) e.stopPropagation(); if (!lbImages.length) return; lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; renderLightbox(); }
function lightboxNext(e) { if (e) e.stopPropagation(); if (!lbImages.length) return; lbIndex = (lbIndex + 1) % lbImages.length; renderLightbox(); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') lightboxPrev();
  else if (e.key === 'ArrowRight') lightboxNext();
  else if (e.key === 'Escape') closeLightbox();
});
(function () {
  let sx = null;
  const isOpen = () => document.getElementById('lightbox').classList.contains('open');
  document.addEventListener('touchstart', (e) => { if (isOpen()) sx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (sx === null || !isOpen()) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) { dx < 0 ? lightboxNext() : lightboxPrev(); }
  }, { passive: true });
})();
function renderPost(p,reactions,comments) {
  const date=new Date(p.created_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const initial=(p.author||'?').charAt(0).toUpperCase();
  const isOwn=p.user_id===currentUser?.id;
  const imgs=(p.photo_urls&&p.photo_urls.length)?p.photo_urls:(p.photo_url?[p.photo_url]:[]);
  feedImages[p.id]=imgs;
  const media=renderCollage(p.id,imgs);
  const body=p.body?`<p class="post-text">${escHtml(p.body)}</p>`:'';
  const delLabel=(!isOwn&&isAdminUser())?'Delete post (admin)':'Delete post';
  const del=canDeletePost(p)?`<button class="post-delete" onclick="deletePost('${p.id}')">${delLabel}</button>`:'';
  return `<div class="post-card" id="post-${p.id}">${media}<div class="post-body-content"><div class="post-meta"><div class="post-avatar">${initial}</div><div><div class="post-author">${escHtml(p.author||'Family Member')}</div><div class="post-date">${date}</div></div></div>${body}${del}</div><div class="comments-section">${renderComments(p.id,comments)}${renderReactions(p.id,reactions)}<div class="comment-input-row"><button class="add-reaction-btn" onclick="openEmojiPicker(event,'${p.id}')" title="Add a reaction" aria-label="Add a reaction">+</button><input type="text" id="comment-input-${p.id}" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')addComment('${p.id}')" /><button class="comment-submit" onclick="addComment('${p.id}')">Post</button></div></div></div>`;
}
function renderReactions(postId,reactions) {
  const byEmoji={};
  reactions.forEach(r=>{ (byEmoji[r.emoji]=byEmoji[r.emoji]||[]).push(r); });
  const chips=Object.keys(byEmoji).map(emoji=>{
    const matches=byEmoji[emoji]; const count=matches.length;
    const mine=matches.find(r=>r.user_id===currentUser?.id);
    const cls=mine?'reaction-btn reacted':'reaction-btn';
    return `<button class="${cls}" onclick="toggleReaction('${postId}','${emoji}','${mine?mine.id:''}')">${emoji}<span class="reaction-count">${count}</span></button>`;
  }).join('');
  return `<div class="reactions-row" id="reactions-${postId}">${chips}</div>`;
}
async function toggleReaction(postId,emoji,existingId) {
  if (existingId) { await sb.from('reactions').delete().eq('id',existingId); }
  else { await sb.from('reactions').insert({post_id:postId,user_id:currentUser.id,emoji}); }
  await refreshReactions(postId);
}
async function refreshReactions(postId) {
  const { data } = await sb.from('reactions').select('*').eq('post_id',postId);
  const el = document.getElementById(`reactions-${postId}`);
  if (el) el.outerHTML = renderReactions(postId, data||[]);
}
let emojiTargetPostId = null;
async function addReaction(postId, emoji) {
  // Add the reaction if the user hasn't already used this emoji here.
  const { data: existing } = await sb.from('reactions').select('id')
    .eq('post_id',postId).eq('user_id',currentUser.id).eq('emoji',emoji).maybeSingle();
  if (!existing) { await sb.from('reactions').insert({post_id:postId,user_id:currentUser.id,emoji}); }
  await refreshReactions(postId);
}
function openEmojiPicker(event, postId) {
  event.stopPropagation();
  emojiTargetPostId = postId;
  const pop = document.getElementById('emoji-popover');
  pop.classList.add('open');
  const r = event.currentTarget.getBoundingClientRect();
  const W = 340, H = 400;
  let left = Math.max(8, Math.min(r.left, window.innerWidth - W - 8));
  let top = r.bottom + 6;
  if (top + H > window.innerHeight) top = Math.max(8, r.top - H - 6);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function hideEmojiPopover() {
  const pop = document.getElementById('emoji-popover');
  if (pop) pop.classList.remove('open');
  emojiTargetPostId = null;
}
function setupEmojiPicker() {
  const pop = document.getElementById('emoji-popover');
  const picker = pop && pop.querySelector('emoji-picker');
  if (!picker || picker.dataset.ready) return;
  picker.dataset.ready = '1';
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  picker.classList.add(dark ? 'dark' : 'light');
  picker.addEventListener('emoji-click', (e) => {
    const emoji = e.detail && e.detail.unicode;
    if (emoji && emojiTargetPostId) addReaction(emojiTargetPostId, emoji);
    hideEmojiPopover();
  });
  document.addEventListener('click', (e) => {
    if (pop.classList.contains('open') && !pop.contains(e.target) && !(e.target.closest && e.target.closest('.add-reaction-btn'))) hideEmojiPopover();
  });
}
function renderComments(postId,comments) {
  const items=comments.map(c=>{
    const initial=(c.author||'?').charAt(0).toUpperCase();
    const date=new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const isOwn=c.user_id===currentUser?.id;
    const del=isOwn?`<button class="comment-delete" onclick="deleteComment('${c.id}')">&#10005;</button>`:'';
    return `<div class="comment-item" id="comment-${c.id}"><div class="comment-avatar">${initial}</div><div class="comment-body"><span class="comment-author">${escHtml(c.author)}</span><div class="comment-text">${escHtml(c.body)}</div><div class="comment-date">${date}</div></div>${del}</div>`;
  }).join('');
  return `<div class="comments-list" id="comments-${postId}">${items}</div>`;
}
async function addComment(postId) {
  const input=document.getElementById(`comment-input-${postId}`); const body=input.value.trim(); if(!body) return;
  input.value='';
  const { data, error } = await sb.from('comments').insert({ post_id:postId, user_id:currentUser.id, author:currentProfile?.name||currentUser.email, body }).select().single();
  if (error||!data) return;
  const list=document.getElementById(`comments-${postId}`);
  const initial=(data.author||'?').charAt(0).toUpperCase();
  const date=new Date(data.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const div=document.createElement('div'); div.className='comment-item'; div.id=`comment-${data.id}`;
  div.innerHTML=`<div class="comment-avatar">${initial}</div><div class="comment-body"><span class="comment-author">${escHtml(data.author)}</span><div class="comment-text">${escHtml(data.body)}</div><div class="comment-date">${date}</div></div><button class="comment-delete" onclick="deleteComment('${data.id}')">&#10005;</button>`;
  list.appendChild(div);
}
async function deleteComment(commentId) {
  await sb.from('comments').delete().eq('id',commentId);
  document.getElementById(`comment-${commentId}`)?.remove();
}
async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  const { data:post } = await sb.from('posts').select('photo_url,photo_urls').eq('id',id).single();
  await sb.from('posts').delete().eq('id',id);
  const urls=(post?.photo_urls&&post.photo_urls.length)?post.photo_urls:(post?.photo_url?[post.photo_url]:[]);
  const paths=urls.map(u=>u.split('/family-photos/')[1]).filter(Boolean);
  if (paths.length) await sb.storage.from('family-photos').remove(paths);
  document.getElementById(`post-${id}`)?.remove();
}
function showMsg(id,text,type) { const el=document.getElementById(id); el.textContent=text; el.className=`msg ${type}`; }
function hideMsg(id) { const el=document.getElementById(id); el.className='msg'; el.textContent=''; }
function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
init();
</script>
